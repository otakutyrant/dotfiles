fail_fast: true
repos:
  - repo: local
    hooks:
      - id: dotfiles-format
        name: Format Nix and Lua
        entry: nix fmt
        language: system
        pass_filenames: false
      - id: dotfiles-check
        name: Check Nix, Lua, and Nushell
        entry: nix run .#check
        language: system
        pass_filenames: false
